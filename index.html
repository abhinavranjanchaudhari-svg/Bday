<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>100 Days To Go · celebration</title>

<style>
:root{
  --bg:#fdf7fb;
  --pink:#f4a6c1;
  --pink2:#f8c8dc;
  --pink3:#fde8f0;
  --lav:#dfd0ee;
  --ink:#5c434e;
  --soft:#9a7b89;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}

.bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(#e8d9f0 1.1px,transparent 1.1px),
    linear-gradient(90deg,#f0d9e6 1.1px,transparent 1.1px),
    linear-gradient(#f5e6f0 1px,transparent 1px),
    linear-gradient(90deg,#f5e6f0 1px,transparent 1px);
  background-size:86px 86px,86px 86px,21.5px 21.5px,21.5px 21.5px;
  opacity:.82;
}

.cloud{
  position:fixed;
  top:-90px;
  left:-55px;
  width:720px;
  height:245px;
  background:var(--lav);
  border-radius:0 0 48% 42%;
  opacity:.48;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:var(--lav);
  border-radius:50%;
}

.cloud:before{
  width:190px;
  height:125px;
  left:200px;
  top:20px;
}

.cloud:after{
  width:200px;
  height:120px;
  right:90px;
  top:22px;
}

.float{
  position:fixed;
  z-index:1;
  opacity:.28;
  animation:float 6s ease-in-out infinite;
  pointer-events:none;
}

.f1{left:7%;top:15%;font-size:22px}
.f2{right:9%;top:18%;font-size:19px;animation-delay:1s}
.f3{left:9%;bottom:17%;font-size:18px;animation-delay:2s}
.f4{right:8%;bottom:20%;font-size:23px;animation-delay:3s}
.f5{left:50%;top:10%;font-size:14px;opacity:.18}

@keyframes float{
  50%{transform:translateY(-9px) rotate(4deg)}
}

.wrap{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card{
  width:min(92vw,430px);
  min-height:560px;
  padding:38px 28px 30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(255,245,248,.62);
  border:1px solid rgba(244,166,193,.45);
  border-radius:32px;
  box-shadow:
    0 30px 70px rgba(180,150,175,.18),
    inset 0 1px rgba(255,255,255,.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  animation:cardIn 1.1s cubic-bezier(.16,1,.3,1);
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(24px) scale(.96)}
  to{opacity:1;transform:none}
}

.cake{
  font-size:62px;
  line-height:1;
  margin-bottom:23px;
  filter:drop-shadow(0 10px 18px rgba(220,150,180,.2));
  animation:breathe 4s ease-in-out infinite;
}

@keyframes breathe{
  50%{transform:translateY(-5px) rotate(1deg)}
}

.number{
  font-size:clamp(82px,23vw,112px);
  line-height:.8;
  font-weight:400;
  letter-spacing:-.06em;
  color:#e89ab8;
  text-shadow:0 5px 25px rgba(230,150,185,.18);
}

.days{
  margin-top:18px;
  font-size:clamp(28px,8vw,38px);
  letter-spacing:.02em;
}

.sub{
  margin:17px 0 30px;
  max-width:290px;
  font-size:16px;
  line-height:1.65;
  color:var(--soft);
}

button{
  appearance:none;
  border:0;
  cursor:pointer;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:13px;
  letter-spacing:.12em;
  padding:15px 28px;
  border-radius:999px;
  background:linear-gradient(135deg,#f4a6c1,#e990b0);
  box-shadow:
    0 12px 28px rgba(220,135,170,.28),
    inset 0 1px rgba(255,255,255,.5);
  transition:.25s ease;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 32px rgba(220,135,170,.34);
}

button:active{
  transform:scale(.96);
}

.modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(92,67,78,.16);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:.45s ease;
}

.modal.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.modal-card{
  width:min(90vw,370px);
  padding:40px 28px;
  text-align:center;
  background:#fff8fb;
  border:1px solid #f4c2d4;
  border-radius:28px;
  box-shadow:0 28px 70px rgba(80,50,70,.2);
  transform:translateY(15px) scale(.96);
  transition:.5s cubic-bezier(.16,1,.3,1);
}

.modal.show .modal-card{
  transform:none;
}

.modal h2{
  margin:0;
  font-size:30px;
  font-weight:400;
}

.modal p{
  margin:15px 0 0;
  color:var(--soft);
  font-size:15px;
  line-height:1.6;
}

.spark{
  position:fixed;
  z-index:10;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#f3b7cd;
  pointer-events:none;
  animation:spark 1.5s ease-out forwards;
}

@keyframes spark{
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

@media(max-height:650px){
  .card{
    min-height:auto;
    padding:25px 24px;
  }

  .cake{
    font-size:48px;
    margin-bottom:16px;
  }

  .number{
    font-size:76px;
  }

  .sub{
    margin:13px 0 20px;
  }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="cloud"></div>

<div class="float f1">♡</div>
<div class="float f2">✦</div>
<div class="float f3">♡</div>
<div class="float f4">✧</div>
<div class="float f5">·</div>

<audio id="bgMusic" loop preload="auto">
  <source src="abhinav.mp3" type="audio/mpeg">
</audio>

<main class="wrap">
  <section class="card">
    <div class="cake">🎂</div>

    <div class="number">100</div>

    <div class="days">days to go</div>

    <p class="sub">
      until a very special little milestone.<br>
      just 100 days to go ♡
    </p>

    <button id="celebrate">let’s celebrate</button>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2>File expired</h2>
    <p>File expired on 27 September · 12:00 PM</p>
  </div>
</div>

<script>
const music=document.getElementById("bgMusic");
const button=document.getElementById("celebrate");
const modal=document.getElementById("modal");

function burst(){
  for(let i=0;i<18;i++){
    const dot=document.createElement("span");
    dot.className="spark";
    dot.style.left="50%";
    dot.style.top="50%";
    dot.style.setProperty("--x",(Math.random()*220-110)+"px");
    dot.style.setProperty("--y",(Math.random()*220-110)+"px");
    document.body.appendChild(dot);
    setTimeout(()=>dot.remove(),1500);
  }
}

button.onclick=()=>{
  music.volume=.6;
  music.play().catch(()=>{});
  burst();

  setTimeout(()=>{
    modal.classList.add("show");
  },350);
};
</script>

</body>
</html>
